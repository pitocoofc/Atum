name: Gerar APK Ndj-lib Reborn

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar Dependências
        run: |
          npm install
          npm install @capacitor/assets --save-dev

      - name: Preparar Assets
        run: |
          mkdir -p assets

          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            echo "✓ icon.png copiado para assets/"
          else
            echo "✗ icon.png não encontrado na raiz"
            exit 1
          fi

      - name: Preparar Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync

      - name: Gerar Ícones Android
        run: |
          echo "=== Gerando assets ==="

          npx capacitor-assets generate

          echo ""
          echo "=== Arquivos gerados ==="
          find android/app/src/main/res | grep ic_launcher || true

          echo ""
          echo "=== Drawable ==="
          find android/app/src/main/res | grep foreground || true

      - name: Configurar Permissões
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.permission.INTERNET" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"

          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

          grep -q "android.permission.WAKE_LOCK" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"

          grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"

      - name: Sincronizar Projeto
        run: |
          npx cap sync

      - name: Verificar Ícones
        run: |
          echo "=== Conteúdo mipmap ==="
          find android/app/src/main/res/mipmap* -type f || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostsearch
          path: android/app/build/outputs/apk/debug/*.apk
