name: Gerar APK Ndj-lib Reborn

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar Dependências
        run: |
          npm install
          npm install @capacitor/assets --save-dev

      - name: Preparar Android
        run: |
          npx cap add android || true
          npx cap sync

      - name: Gerar Ícones Android
        run: |
          echo "Arquivos da raiz:"
          ls -la

          if [ -f "icon.png" ]; then
            echo "icon.png encontrado"

            npx capacitor-assets generate --android

            echo "Ícones gerados:"
            find android/app/src/main/res -name "*ic_launcher*" || true

          else
            echo "ERRO: icon.png não encontrado"
            exit 1
          fi

      - name: Configurar Permissões
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.permission.INTERNET" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"

          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

          grep -q "android.permission.WAKE_LOCK" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"

          grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"

      - name: Sincronizar Projeto
        run: |
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostsearch
          path: android/app/build/outputs/apk/debug/*.apk
